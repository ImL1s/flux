name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  pr-title-check:
    name: PR Title Check
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Title Format
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          # Conventional Commits pattern
          PATTERN="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .+"
          if [[ ! "$TITLE" =~ $PATTERN ]]; then
            echo "❌ PR title does not follow Conventional Commits format."
            echo ""
            echo "Expected format: <type>(<scope>): <description>"
            echo "Examples:"
            echo "  feat(compiler): add constant folding optimization"
            echo "  fix(vm): resolve stack overflow in recursion"
            echo "  docs: update README with new examples"
            echo ""
            echo "Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            exit 1
          fi
          echo "✅ PR title format is valid!"

  detect-changes:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      compiler: ${{ steps.filter.outputs.compiler }}
      vm: ${{ steps.filter.outputs.vm }}
      flutter: ${{ steps.filter.outputs.flutter }}
      lsp: ${{ steps.filter.outputs.lsp }}
      dap: ${{ steps.filter.outputs.dap }}
      cli: ${{ steps.filter.outputs.cli }}
      updater: ${{ steps.filter.outputs.updater }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            compiler:
              - 'packages/flux_compiler/**'
            vm:
              - 'packages/flux_vm/**'
            flutter:
              - 'packages/flux_flutter/**'
            lsp:
              - 'packages/flux_lsp/**'
            dap:
              - 'packages/flux_dap/**'
            cli:
              - 'packages/flux_cli/**'
            updater:
              - 'packages/flux_updater/**'

  quick-test:
    name: Quick Test for Changed Packages
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
      
      
      - name: Test flux_compiler
        if: needs.detect-changes.outputs.compiler == 'true'
        run: |
          cd packages/flux_compiler
          dart pub get
          dart test --reporter=compact
      
      - name: Test flux_vm
        if: needs.detect-changes.outputs.vm == 'true'
        run: |
          cd packages/flux_vm
          dart pub get
          dart test --reporter=compact
      
      - name: Test flux_flutter
        if: needs.detect-changes.outputs.flutter == 'true'
        run: |
          cd packages/flux_flutter
          flutter pub get
          flutter test --reporter=compact
      
      - name: Test flux_lsp
        if: needs.detect-changes.outputs.lsp == 'true'
        run: |
          cd packages/flux_lsp
          dart pub get
          dart test --reporter=compact

      - name: Test flux_cli
        if: needs.detect-changes.outputs.cli == 'true'
        run: |
          cd packages/flux_cli
          dart pub get
          dart test --reporter=compact
      
      - name: Test flux_updater
        if: needs.detect-changes.outputs.updater == 'true'
        run: |
          cd packages/flux_updater
          dart pub get
          dart test --reporter=compact
      
      - name: No packages changed
        if: |
          needs.detect-changes.outputs.compiler != 'true' &&
          needs.detect-changes.outputs.vm != 'true' &&
          needs.detect-changes.outputs.flutter != 'true' &&
          needs.detect-changes.outputs.lsp != 'true' &&
          needs.detect-changes.outputs.dap != 'true' &&
          needs.detect-changes.outputs.cli != 'true' &&
          needs.detect-changes.outputs.updater != 'true'
        run: echo "No package changes detected, skipping tests."
