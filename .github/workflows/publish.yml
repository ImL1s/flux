name: Publish to pub.dev

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (all, compiler, vm, flutter, lsp, dap)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - lsp
          - dap
          - updater
          - updater
      dry_run:
        description: 'Dry run (do not actually publish)'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish-compiler:
    name: Publish flux_compiler
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.package == 'all' || github.event.inputs.package == 'compiler' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
      - name: Setup pub credentials
        run: |
          mkdir -p ~/.config/dart
          echo '${{ secrets.PUB_CREDENTIALS }}' > ~/.config/dart/pub-credentials.json
      - name: Publish
        run: |
          cd packages/flux_compiler
          dart pub get
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            dart pub publish --dry-run
          else
            dart pub publish --force
          fi

  publish-vm:
    name: Publish flux_vm
    runs-on: ubuntu-latest
    needs: publish-compiler
    if: ${{ github.event_name == 'push' || github.event.inputs.package == 'all' || github.event.inputs.package == 'vm' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
      - name: Setup pub credentials
        run: |
          mkdir -p ~/.config/dart
          echo '${{ secrets.PUB_CREDENTIALS }}' > ~/.config/dart/pub-credentials.json
      - name: Publish
        run: |
          cd packages/flux_vm
          dart pub get
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            dart pub publish --dry-run
          else
            dart pub publish --force
          fi

  publish-downstream:
    name: Publish downstream packages
    runs-on: ubuntu-latest
    needs: publish-vm
    if: ${{ github.event_name == 'push' || github.event.inputs.package == 'all' }}
    strategy:
      matrix:
        package: [flux_lsp, flux_dap, flux_updater]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
      - name: Setup pub credentials
        run: |
          mkdir -p ~/.config/dart
          echo '${{ secrets.PUB_CREDENTIALS }}' > ~/.config/dart/pub-credentials.json
      - name: Publish ${{ matrix.package }}
        run: |
          cd packages/${{ matrix.package }}
          dart pub get
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            dart pub publish --dry-run
          else
            dart pub publish --force
          fi

  publish-flutter:
    name: Publish flux_flutter
    runs-on: ubuntu-latest
    needs: publish-vm
    if: ${{ github.event_name == 'push' || github.event.inputs.package == 'all' || github.event.inputs.package == 'flutter' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
      - name: Setup pub credentials
        run: |
          mkdir -p ~/.config/dart
          echo '${{ secrets.PUB_CREDENTIALS }}' > ~/.config/dart/pub-credentials.json
      - name: Publish
        run: |
          cd packages/flux_flutter
          flutter pub get
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            flutter pub publish --dry-run
          else
            flutter pub publish --force
          fi

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-downstream, publish-flutter]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
