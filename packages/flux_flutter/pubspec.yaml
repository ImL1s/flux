name: flux_flutter
description: "Flutter bindings for the Flux scripting language."
version: 2.0.1
homepage: https://github.com/ImL1s/flux
repository: https://github.com/ImL1s/flux

environment:
  sdk: ^3.6.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flux_vm: ^2.0.0
  flux_compiler: ^2.0.0
  path_provider: ^2.1.2
  path: ^1.9.0
  flutter_riverpod: ^2.5.1
  web_socket_channel: ^2.4.0
  http: ^1.6.0
  crypto: ^3.0.3
  shared_preferences: ^2.4.0
  uuid: ^4.3.3
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  camera: ^0.10.5+9
  flutter_blue_plus: ^1.32.0
  permission_handler: ^11.3.1
  hive: ^2.2.3
  flutter_secure_storage: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.0
  lints: ^5.1.1

