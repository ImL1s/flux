name: flux_flutter
description: "Flutter bindings for the Flux scripting language."
version: 2.0.1
homepage: https://github.com/ImL1s/flux
publish_to: none
repository: https://github.com/ImL1s/flux

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flux_vm:
    path: ../flux_vm
  flux_compiler:
    path: ../flux_compiler
  path_provider: ^2.1.2
  path: ^1.9.0
  flutter_riverpod: ">=2.5.1 <4.0.0"
  web_socket_channel: ^3.0.3
  http: ^1.6.0
  dio: ^5.4.0
  crypto: ^3.0.3
  shared_preferences: ^2.4.0
  uuid: ^4.3.3
  device_info_plus: ^11.0.0
  package_info_plus: ^8.0.0
  camera: ^0.11.0
  flutter_blue_plus: ^2.1.0
  permission_handler: ^12.0.1
  hive_ce: ^2.16.0
  hive_ce_flutter: ^2.3.3
  flutter_secure_storage: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  http_mock_adapter: ^0.6.1
  mocktail: ^1.0.0
  lints: ^5.1.1

