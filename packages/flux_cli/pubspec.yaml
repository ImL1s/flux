version: 2.0.0
homepage: https://github.com/ImL1s/flux
publish_to: none
repository: https://github.com/ImL1s/flux

environment:
  sdk: ^3.6.0

dependencies:
  flux_compiler:
    path: ../flux_compiler
  flux_vm:
    path: ../flux_vm
  args: ^2.6.0
  shelf: ^1.4.2
  shelf_web_socket: ^3.0.0
  watcher: ^1.2.0
  web_socket_channel: ^3.0.3
  cryptography: ^2.9.0

dev_dependencies:
  test: ^1.28.0
  lints: ^6.0.0

executables:
  flux: flux
  flux_repl: repl
